<h1 class="text-4xl">My accounts</h1>
<a mat-button="filled" routerLink="/account">Add account</a>
@if (loading()) {
<p>Loading accounts...</p>
}
@else {
<table mat-table [dataSource]="accounts" class="mat-shadow-2">

  <!-- ID Column -->
  <ng-container matColumnDef="id">
    <th mat-header-cell *matHeaderCellDef> ID </th>
    <td mat-cell *matCellDef="let element"> {{element.id}} </td>
  </ng-container>

  <!-- Name Column -->
  <ng-container matColumnDef="name">
    <th mat-header-cell *matHeaderCellDef> Name </th>
    <td mat-cell *matCellDef="let element"> {{element.name}} </td>
  </ng-container>

  <!-- Initial Balance Column -->
  <ng-container matColumnDef="initialBalance">
    <th mat-header-cell *matHeaderCellDef> Initial Balance </th>
    <td mat-cell *matCellDef="let element"> {{element.initialBalance}} </td>
  </ng-container>

  <!-- Current Balance Column -->
  <ng-container matColumnDef="currentBalance">
    <th mat-header-cell *matHeaderCellDef> Current Balance </th>
    <td mat-cell *matCellDef="let element"> {{element.currentBalance}} </td>
  </ng-container>

  <!-- Type Name Column -->
  <ng-container matColumnDef="typeName">
    <th mat-header-cell *matHeaderCellDef> Type </th>
    <td mat-cell *matCellDef="let element"> {{element.typeName}} </td>
  </ng-container>

  <!-- Options Column -->
  <ng-container matColumnDef="options">
    <th mat-header-cell *matHeaderCellDef> Options </th>
    <td mat-cell *matCellDef="let element"> 
      <a matButton aria-label="Edit account" title="Edit account">
        <mat-icon>edit</mat-icon>
      </a>
      <button matFab aria-label="Delete account" title="Delete account">
        <mat-icon>delete</mat-icon>
      </button>
    </td>
  </ng-container>

  <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
  <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
</table>
}
