<mat-card appearance="outlined" class="login-card">
  <div class="mat-card-avatar flex justify-center">
    <img src="https://placehold.co/100x56?text=Hello+World" alt="Logo" class="logo-image">
  </div>
  <mat-card-title>
    <h1 class="text-center">Welcome Back</h1>
  </mat-card-title>
  <p class="text-center">
    Please enter your credentials to login
  </p>
  <mat-card-content>
    <form [formGroup]="form" (ngSubmit)="login()" class="flex flex-col">
      <mat-form-field appearance="outline" class="login-form-field">
        <mat-label>Email Address</mat-label>
        <input matInput formControlName="email" type="email" placeholder="name@company.com" required>
      </mat-form-field>

      <mat-form-field appearance="outline" class="login-form-field">
        <mat-label>Password</mat-label>
        <input matInput formControlName="password" type="password" required>
      </mat-form-field>

      <button mat-flat-button class="submit-button primary-submit-button" type="submit" [disabled]="form.invalid">
        Sign In
      </button>
      <p class="text-center">OR</p>
      <button mat-flat-button class="submit-button secondary-submit-button" (click)="navigateToRegister()">
        Create an account
      </button>
    </form>
  </mat-card-content>
</mat-card>
